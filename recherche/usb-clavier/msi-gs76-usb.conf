# Hypothèse de recherche NON CONFIRMÉE (voir ../README.fr.md).
# MSI GS76 : le contrôleur RVB du clavier (SteelSeries KLC 1038:113a) annonce
# l'USB2 LPM (veille L1). Hypothèse : L1 pendant l'énumération provoque
# "can't set config #1, error -71" / "not accepting address", surtout après
# un redémarrage à chaud. Quirk k = USB_QUIRK_NO_LPM, limité à ce périphérique.
KERNEL_CMDLINE[default]+=" usbcore.quirks=1038:113a:k"
