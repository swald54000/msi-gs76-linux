# thermald ne lit l'arbre powercap RAPL qu'au démarrage ; l'alias PS/2 du pavé tactile
# étant masqué (correctif 2), l'espace utilisateur démarre environ 0,5 s plus tôt et peut
# devancer le chargement des modules intel_rapl_* (« NO RAPL sysfs present »).
# On attend donc jusqu'à 5 s.
[Service]
ExecStartPre=/bin/sh -c 'for i in $$(seq 50); do [ -e /sys/class/powercap/intel-rapl:0 ] && exit 0; sleep 0.1; done; exit 0'
